[project]
name = "pyecap"
description = "pyeCAP is a python package for the analysis of evoked compound action potentials (CAPs) in electrophysiology data sets."
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = { text = "LGPL-2.1" }

authors = [
  { name = "James Trevathan", email = "jtrevathan@wisc.edu" }
]

# ───── Runtime dependencies ─────
dependencies = [
  "numpy",
  "dask",
  "pandas",
  "scipy",
  "seaborn",
  "ipywidgets",
  "mne",
  "numba",
  "cached-property",
  "cachey",
  "zarr",
  "xarray",
  "matplotlib",
  "tdt",
  "h5py",
  "ipympl",
  "xlrd",
  "openpyxl",
  "cycler",
  "Pillow",
  "tqdm",
  "opencv-python",
  "plotly",
  "notebook<=6.5",
  # caret (^) becomes the compatible‑release operator (~=)
  "adi-reader~=0.0.9"
]

# ───── Dev / docs / test extras ─────
[project.optional-dependencies.dev]
dev = [
  "sphinx-rtd-theme",
  "black",
  "jupyterlab",
  "devpi-client",
  "pytest",
  "tox",
  "jupyter-contrib-nbextensions",
  "pre-commit",
  "isort"
]

# ───── Dynamic version from Git, Poetry‑style ─────
# (hatch‑vcs gives the same semantics as poetry‑dynamic‑versioning)
dynamic = ["version"]

[tool.hatch.version]
source = "vcs"
scheme = "semver"

# ───── Build backend ─────
[build-system]
requires = [
  "hatchling>=1.24",
  "hatch-vcs>=0.4"
]
build-backend = "hatchling.build"
