[project]
name = "pyecap"
description = "pyeCAP is a python package for the analysis of evoked compound action potentials (CAPs) in electrophysiology data sets."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "LGPL-2.1" }
version = "0.0.11"

authors = [
  { name = "James Trevathan", email = "jtrevathan@wisc.edu" }
]

# ───── Runtime dependencies ─────
dependencies = [
  "numpy",
  "dask",
  "pandas>=2.3.3,<3",
  "scipy",
  "seaborn",
  "ipywidgets",
  "mne",
  "numba",
  "cached-property",
  "cachey",
  "matplotlib",
  "tdt",
  "h5py",
  "xlrd",
  "openpyxl",
  "plotly",
  "pyvisa",
  "requests",
  "python-dateutil"
]

# ───── Dev / docs / test extras ─────
[dependency-groups]
test = [
  "pytest>=9,<10",
]

lint = [
  "ruff>=0.16,<0.17",
]

dev = [
  { include-group = "test" },
  { include-group = "lint" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyecap"]

[[tool.uv.index]]
name = "devpi"
url = "https://devpi.ninjaneering.io/jtrevathan/dev/"
publish-url = "https://devpi.ninjaneering.io/jtrevathan/dev/"
explicit = true

# ───── Build backend ─────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
